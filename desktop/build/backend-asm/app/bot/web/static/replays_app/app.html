<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ValoHub</title>
  <link rel="stylesheet" href="/static/replays_app/ui/tokens.css">
  <link rel="stylesheet" href="/static/replays_app/ui/components.css">
  <link rel="stylesheet" href="/static/replays_app/ui/app-shell.css">
  <link rel="stylesheet" href="/static/replays_app/ui/spaces/library.css">
  <link rel="stylesheet" href="/static/replays_app/ui/spaces/replay.css">
  <link rel="stylesheet" href="/static/replays_app/ui/spaces/analysis.css">
  <link rel="stylesheet" href="/static/replays_app/ui/spaces/coach.css">
  <link rel="stylesheet" href="/static/replays_app/ui/spaces/providers.css">
  <link rel="stylesheet" href="/static/replays_app/ui/spaces/settings.css">
  <link rel="stylesheet" href="/static/replays_app/ui/brand.css">
  <link rel="stylesheet" href="/static/replays_app/ui/polish.css">
  <link rel="icon" href="/static/replays_app/brand/mark.svg">
  <script type="module" src="/static/replays_app/ui/boot.js"></script>
</head>
<body data-rail="closed">
  <div id="titlebar" class="titlebar" data-testid="titlebar">
    <div class="titlebar__brand"><span class="titlebar__mark" aria-hidden="true"></span><span>ValoHub</span><span class="titlebar__space" id="titlebar-space"></span></div>
    <button type="button" id="palette-trigger" class="palette-trigger" data-testid="palette-trigger" aria-haspopup="dialog" aria-label="Open command palette"><span class="palette-trigger__text">Search or jump to…</span><span class="kbd">Ctrl K</span></button>
    <div class="titlebar__right"><button type="button" id="provider-chip" class="provider-chip" data-testid="provider-chip" aria-label="AI provider: none"><span class="dot" aria-hidden="true"></span><span id="provider-chip-text">No model</span></button></div>
  </div>
  <div class="app-body">
    <nav id="rail" class="rail" data-testid="rail" aria-label="Primary">
      <a class="rail__item" id="rail-library" data-testid="rail-library" data-route="library" href="/replays" aria-label="Library"><span class="rail__icon" aria-hidden="true">▦</span><span class="rail__label">Library</span></a>
      <a class="rail__item" id="rail-analysis" data-testid="rail-analysis" data-route="analysis" href="/analysis" aria-label="Analysis"><span class="rail__icon" aria-hidden="true">◫</span><span class="rail__label">Analysis</span></a>
      <a class="rail__item" id="rail-coach" data-testid="rail-coach" data-route="coach" href="/coach" aria-label="Coach"><span class="rail__icon" aria-hidden="true">✦</span><span class="rail__label">Coach</span></a>
      <a class="rail__item" id="rail-providers" data-testid="rail-providers" data-route="providers" href="/providers" aria-label="AI Providers"><span class="rail__icon" aria-hidden="true">⚙</span><span class="rail__label">AI Providers</span></a>
      <a class="rail__item" id="rail-settings" data-testid="rail-settings" data-route="settings" href="/settings" aria-label="Settings"><span class="rail__icon" aria-hidden="true">☰</span><span class="rail__label">Settings</span></a>
      <span class="rail__spacer"></span>
      <div class="rail__foot"><span class="dot" id="backend-dot" aria-hidden="true"></span><span class="rail__foot-text" id="backend-text">Backend</span></div>
    </nav>
    <div class="main-col">
      <header class="context-bar" id="context-bar"><div class="context-bar__text"><h1 class="context-bar__title" id="context-title">ValoHub</h1><span class="context-bar__sub" id="context-sub"></span></div><div class="context-bar__actions" id="context-actions"></div></header>
      <main id="space" class="space" data-testid="space" tabindex="-1"></main>
    </div>
  </div>
  <footer id="statusbar" class="statusbar" data-testid="statusbar">
    <button type="button" class="statusbar__seg" id="status-parser" data-testid="status-parser" aria-label="Parser status"><span class="dot" aria-hidden="true"></span><span class="seg-text">Parser: unknown</span></button>
    <button type="button" class="statusbar__seg" id="status-provider" data-testid="status-provider" aria-label="Provider status"><span class="seg-text">Model: none</span></button>
    <button type="button" class="statusbar__seg" id="status-job" data-testid="status-job" aria-label="Active job"><span class="seg-text">No active job</span></button>
    <span class="statusbar__grow"></span>
    <button type="button" class="statusbar__seg" id="status-build" data-testid="status-build" aria-label="Build version"><span class="seg-text">build —</span></button>
    <button type="button" class="statusbar__seg" id="status-hint" data-testid="status-hint" aria-label="Open command palette"><span class="kbd">Ctrl K</span><span class="seg-text">Commands</span></button>
  </footer>
  <div id="announcer" class="sr-only" aria-live="polite" role="status"></div>
  <div id="overlay-root"></div>
</body>
</html>
