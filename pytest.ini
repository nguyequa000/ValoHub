[pytest]
# Whole-repo `pytest` must collect only this repo's tests: not scratch clones (VALOPLANT_WORK/tmp),
# sibling git worktrees, the vendored parser or JS dependency trees.
norecursedirs =
    VALOPLANT_WORK
    .worktrees
    vendor*
    node_modules
    dotnet10-sdk
    extracted_data
    .*
    build
    dist
    venv
    env
    *.egg-info
